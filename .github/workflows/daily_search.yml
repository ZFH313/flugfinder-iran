name: Daily Flight Search

on:
  schedule:
    # Jeden Tag um 6:00 Uhr UTC (= 8:00 Uhr deutscher Zeit im Sommer)
    - cron: '0 6 * * *'
  
  # Manuell auslösbar mit optionalem Datum-Parameter
  workflow_dispatch:
    inputs:
      dates:
        description: 'Manuelle Reisedaten (Format: YYYY-MM-DD:YYYY-MM-DD)'
        required: false
        type: string

jobs:
  search:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Dependencies installieren
        run: pip install -r requirements.txt

      - name: Flugsuche starten (automatisch)
        if: ${{ github.event.inputs.dates == '' }}
        run: python main.py --verbose
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Flugsuche starten (manuelles Datum)
        if: ${{ github.event.inputs.dates != '' }}
        run: python main.py --dates "${{ github.event.inputs.dates }}" --verbose
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Ergebnisse committen und pushen
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/data.json results/ data/price_history.json
          git diff --staged --quiet || git commit -m "🛫 Flugsuch-Ergebnisse $(date +'%Y-%m-%d %H:%M')"
          git push
