<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<h2>FlugFinder Icon Generator</h2>
<p>Rechtsklick auf jedes Bild → "Bild speichern unter..." → in den <code>icons/</code> Ordner speichern.</p>

<h3>apple-touch-icon.png (180x180)</h3>
<canvas id="c180" width="180" height="180"></canvas>

<h3>icon-192.png (192x192)</h3>
<canvas id="c192" width="192" height="192"></canvas>

<h3>icon-512.png (512x512)</h3>
<canvas id="c512" width="512" height="512"></canvas>

<h3>favicon-32.png (32x32)</h3>
<canvas id="c32" width="32" height="32"></canvas>

<script>
function drawIcon(canvas) {
    const ctx = canvas.getContext('2d');
    const s = canvas.width;

    // Background gradient
    const grad = ctx.createLinearGradient(0, 0, s, s);
    grad.addColorStop(0, '#667eea');
    grad.addColorStop(1, '#764ba2');

    // Rounded rect
    const r = s * 0.15;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(s - r, 0);
    ctx.quadraticCurveTo(s, 0, s, r);
    ctx.lineTo(s, s - r);
    ctx.quadraticCurveTo(s, s, s - r, s);
    ctx.lineTo(r, s);
    ctx.quadraticCurveTo(0, s, 0, s - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Airplane
    ctx.save();
    ctx.translate(s * 0.5, s * 0.45);
    ctx.rotate(-0.5);
    ctx.fillStyle = 'white';
    ctx.font = `bold ${s * 0.4}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✈', 0, 0);
    ctx.restore();

    // Euro sign
    ctx.fillStyle = '#FFD700';
    ctx.font = `bold ${s * 0.15}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText('€', s * 0.78, s * 0.25);

    // Iran flag stripe
    const barY = s * 0.82;
    const barH = s * 0.035;
    const barW = s * 0.4;
    const barX = (s - barW) / 2;

    ctx.fillStyle = '#239F40';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(barX, barY + barH, barW, barH);
    ctx.fillStyle = '#DA0000';
    ctx.fillRect(barX, barY + barH * 2, barW, barH);
}

drawIcon(document.getElementById('c180'));
drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));
drawIcon(document.getElementById('c32'));

// Convert to downloadable images
['c180','c192','c512','c32'].forEach(id => {
    const canvas = document.getElementById(id);
    const img = document.createElement('img');
    img.src = canvas.toDataURL('image/png');
    img.style.display = 'block';
    img.style.marginTop = '10px';
    img.style.border = '1px solid #ccc';
    canvas.parentNode.insertBefore(img, canvas.nextSibling);
});
</script>
</body>
</html>
