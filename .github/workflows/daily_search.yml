name: Flight Search

# Dateiname bleibt daily_search.yml, weil die PWA diesen Workflow
# über die GitHub-API startet (frontend/app.js).

on:
  schedule:
    # Montag: nur Teheran (4 Abflughäfen × 1 Ziel × 3 Termine = 12 Anfragen)
    - cron: '0 6 * * 1'
    # Donnerstag: zusätzlich Mashhad (4 × 2 × 3 = 24 Anfragen)
    - cron: '0 6 * * 4'

  workflow_dispatch:
    inputs:
      dates:
        description: 'Manuelle Reisedaten (Format: YYYY-MM-DD:YYYY-MM-DD)'
        required: false
        type: string
      all_destinations:
        description: 'Auch Mashhad durchsuchen (verdoppelt die API-Anfragen)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Nur Suchplan und Budget anzeigen – verbraucht KEINE API-Anfragen'
        required: false
        type: boolean
        default: false

jobs:
  search:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Dependencies installieren
        run: pip install -r requirements.txt

      - name: Suchmodus bestimmen
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_ALL_DEST: ${{ github.event.inputs.all_destinations }}
          INPUT_DATES: ${{ github.event.inputs.dates }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS="--verbose"

          # Donnerstags-Lauf oder manuell angefordert → auch Mashhad
          if [ "$SCHEDULE" = "0 6 * * 4" ] || [ "$INPUT_ALL_DEST" = "true" ]; then
            ARGS="$ARGS --all-destinations"
            echo "Ziele: Teheran + Mashhad"
          else
            echo "Ziele: nur Teheran"
          fi

          if [ -n "$INPUT_DATES" ]; then
            ARGS="$ARGS --dates $INPUT_DATES"
            echo "Manuelles Datum: $INPUT_DATES"
          fi

          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
            echo "DRY RUN – es werden keine API-Anfragen gesendet"
            echo "is_dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dry_run=false" >> "$GITHUB_OUTPUT"
          fi

          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Flugsuche starten
        run: python main.py ${{ steps.mode.outputs.args }}
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ vars.RAPIDAPI_HOST }}
          # Optional: Reihenfolge der Suchdienste überschreiben, z.B.
          # "skyscrapper" um einen ausgefallenen Dienst zu überspringen.
          # Anzulegen unter Settings → Variables (kein Secret nötig).
          PROVIDER_ORDER: ${{ vars.PROVIDER_ORDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Ergebnisse committen und pushen
        # Beim Dry-Run entstehen keine Ergebnisse, also nichts zu committen
        if: ${{ steps.mode.outputs.is_dry_run != 'true' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Nur Pfade hinzufügen die tatsächlich existieren.
          # data/airport_ids.json entsteht erst wenn Sky Scrapper einspringt,
          # ein pauschales "git add" würde sonst mit Fehler abbrechen.
          for path in frontend/data.json results data/price_history.json data/airport_ids.json; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done

          git diff --staged --quiet || git commit -m "Flugsuch-Ergebnisse $(date +'%Y-%m-%d %H:%M')"
          git push
